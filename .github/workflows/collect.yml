name: 공고 수집

on:
  schedule:
    # 한국 시간 9시·12시·15시·18시 (UTC 0·3·6·9시)
    - cron: "0 0,3,6,9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 공고 모으기
        run: python scripts/collect.py data.json
      - name: 바뀐 데이터 저장
        run: |
          git config user.name "gongmo-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "공고 데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" || echo "변경 없음"
          git push
