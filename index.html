<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head>
<body>
<title>공모 레이더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 게시판형 단일 컬럼. 위에 검색·필터 고정, 아래 공고 행(마감 D-day 도장 + 본문). */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#15302b; --muted:#5b6f6a; --line:#d9e1de;
  --accent:#0f6b5a; --accent-soft:#dcefe9; --stamp:#c2362b; --stamp-soft:#fbe7e4; --warn:#a86a00; --warn-soft:#fdf0d6;
  --f-display:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#16211e; --ink:#e3ece9; --muted:#93a8a2; --line:#27352f;
  --accent:#4cc3a8; --accent-soft:#163a32; --stamp:#ff7b6e; --stamp-soft:#3a1d1a; --warn:#f0b54a; --warn-soft:#3a2d12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#16211e; --ink:#e3ece9; --muted:#93a8a2; --line:#27352f;
  --accent:#4cc3a8; --accent-soft:#163a32; --stamp:#ff7b6e; --stamp-soft:#3a1d1a; --warn:#f0b54a; --warn-soft:#3a2d12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:860px;margin:0 auto}
header{padding-block:28px 14px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5vw,34px);letter-spacing:-.02em;margin:0;line-height:1.1}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:6px 0 0;font-size:14px}
.asof{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);padding:3px 8px;border-radius:4px;white-space:nowrap}
.panel{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;padding:11px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.row::-webkit-scrollbar{display:none}
.lbl{font-size:11px;letter-spacing:.06em;color:var(--muted);align-self:center;flex:none;margin-right:2px}
.chip{flex:none;font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.chip:focus-visible,.star:focus-visible,a:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tabgroup{display:flex;gap:18px}
.tab{font:inherit;font-weight:600;background:none;border:0;padding:4px 0;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.toggle{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.count{font-size:13px;color:var(--muted);padding-block:12px 4px}
.count b{color:var(--ink);font-family:var(--f-mono)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.dday{font-family:var(--f-mono);font-size:15px;text-align:center;border:2px solid var(--accent);color:var(--accent);border-radius:6px;padding:8px 0 6px;line-height:1.1}
.dday small{display:block;font-family:var(--f-body);font-size:10px;margin-top:3px;letter-spacing:.04em}
.dday.urgent{border-color:var(--stamp);color:var(--stamp);background:var(--stamp-soft);transform:rotate(-3deg)}
.dday.soon{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.dday.closed{border-color:var(--line);color:var(--muted)}
.dday.upcoming{border-style:dashed}
.body{min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.tag{font-size:11.5px;padding:2px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.reg{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.title{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.4;margin:0 0 4px;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.title a{color:inherit;text-decoration:none}
.title a:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.info{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 14px}
.info .per{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.amt{color:var(--ink);font-weight:600}
.star{background:none;border:0;cursor:pointer;font-size:20px;line-height:1;color:var(--line);padding:2px 4px}
.star[aria-pressed="true"]{color:var(--warn)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
footer{margin-top:28px;font-size:12.5px;color:var(--muted);display:grid;gap:6px;max-width:65ch}
footer a{color:var(--accent)}
@media (max-width:520px){
  .item{grid-template-columns:56px 1fr;gap:12px}
  .star{grid-column:2;justify-self:start;padding:0;font-size:14px}
  .star::after{content:" 관심 공고";font-size:12.5px;color:var(--muted)}
}
@media (prefers-reduced-motion:reduce){.dday.urgent{transform:none}}
.toggles{display:flex;gap:14px;flex-wrap:wrap}
.tag.src{background:transparent;color:var(--muted);font-weight:500;padding-inline:0}
.more{display:block;margin:16px auto 0;font:inherit;font-weight:600;padding:10px 22px;border-radius:8px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-top:8px}
.stats b{font-family:var(--f-mono);color:var(--ink);font-weight:500}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>공모 <span>레이더</span></h1>
      <p class="sub">문화재단 공모부터 소상공인 지원사업까지, 지역별로 한 번에 찾기</p>
      <div class="stats" id="stats"></div>
    </div>
    <span class="asof" id="asof">수집 기준 …</span>
  </header>

  <div class="panel">
    <div class="search"><input id="q" type="search" placeholder="사업명·기관 검색 (예: 안산, 카페, 판로, 축제)" aria-label="공고 검색"></div>
    <div class="row" id="regions" aria-label="지역"></div>
    <div class="row" id="cats" aria-label="분야"></div>
    <div class="tabs">
      <div class="tabgroup" role="tablist">
        <button class="tab" id="tab-all" role="tab" aria-selected="true">전체 공고</button>
        <button class="tab" id="tab-fav" role="tab" aria-selected="false">관심 공고</button>
      </div>
      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="hideRental" checked> 대관 공고 숨기기</label>
        <label class="toggle"><input type="checkbox" id="showClosed"> 마감 공고 보기</label>
      </div>
    </div>
  </div>

  <p class="count" id="count"></p>
  <ul id="list"></ul>
  <button class="more" id="more" hidden>더 보기</button>

  <footer>
    <p>출처: 문화포털 문화지원사업, 경기기업비서(경기도경제과학진흥원), 기업마당. 매일 9시·12시·15시·18시에 자동으로 다시 모읍니다. 신청 전에 원문 공고에서 자격과 기간을 꼭 확인하세요.</p>
    <p>'상시'는 마감일 없이 상시 접수하거나 예산이 소진되면 끝나는 공고입니다.</p>
  </footer>
</div>

<script>
// data.json 을 읽어 그린다. data.json 은 매일 9·12·15·18시(한국 시간)에 자동 갱신된다.
const REG_KEYS=[
 ["경기",["경기","수원","안양","과천","부천","용인","구리","양평","오산","광명","고양","의정부","김포","여주","포천","군포","안산","화성","성남","시흥","하남","평택","이천","파주","동두천","남양주","안성","연천","가평","양주","의왕","광주시","한양대학교ERICA"]],
 ["인천",["인천","남동","연수","부평","강화"]],
 ["서울",["서울","강북","노원","서초","은평","금천","영등포","동작","관악","종로","중랑","구로","예술의전당","서리풀","마포","성동","강동","도봉","동대문","강남","송파","양천","강서","용산","성북","광진"]],
 ["강원",["강원","강릉","인제","원주","양양","태백","정선","속초","삼척","양구","화천","춘천","횡성","영월","평창","홍천","철원"]],
 ["충북",["충북","충주","청주","단양","괴산","영동","제천","옥천","음성","진천","보은"]],
 ["충남",["충남","천안","공주","홍주","홍성","서산","아산","당진","보령","논산","부여","서천","예산","태안","금산","계룡"]],
 ["대전",["대전"]],["세종",["세종시","세종특별"]],
 ["전북",["전북","고창","익산","전주","완주","군산","남원","임실","정읍","김제","무주","진안","부안","순창","장수"]],
 ["전남",["전라남도","전남","영암","해남","담양","여수","완도","장성","남도국악원","순천","목포","광양","나주","강진","고흥","보성","화순","무안","함평","영광","진도","신안","구례","곡성","장흥"]],
 ["광주",["광주","아시아문화전당"]],
 ["대구",["대구","수성","행복북구","도심재생","달서","달성"]],
 ["경북",["경북","경상북도","예천","영덕","포항","울진","고령","청도","청송","경주","안동","구미","김천","영주","영천","상주","문경","경산","의성","영양","봉화","성주","칠곡","울릉"]],
 ["경남",["경남","경상남도","창원","진주","밀양","거제","통영","남해","산청","양산","김해","고성문화재단","사천","거창","함양","하동","합천","의령","함안","창녕"]],
 ["부산",["부산"]],
 ["울산",["울산","울주"]],
 ["제주",["제주","서귀포"]]
];
function inferReg(org,title){
  const tag=(title.match(/^\[([^\]]+)\]/)||[])[1];
  if(tag&&!/ㆍ|·|,/.test(tag)){for(const[r,ks]of REG_KEYS)if(ks.some(k=>tag.includes(k)))return r}
  for(const s of [org,title])for(const[r,ks]of REG_KEYS)if(ks.some(k=>s.includes(k)))return r;
  return "전국";
}
function bizCat(t,field){
  if(/관광|여행사|크루즈/.test(t))return "관광";
  if(field==="금융"||/보증|융자|자금|이차|이자|보험료|금융|비즈플러스카드|바우처/.test(t))return "금융";
  if(/소상공인|자영업|소공인|상권|전통시장|음식점|식품위생|1인|배달|간판/.test(t))return "소상공인";
  if(/문화|예술|공연|전시|콘텐츠|축제/.test(t))return "문화예술";
  return "기업·판로";
}

const REGIONS=[["전체",null],["경기",["경기"]],["서울",["서울"]],["인천",["인천"]],["강원",["강원"]],["충청",["충북","충남","대전","세종"]],["전라",["전북","전남","광주"]],["경상",["경북","경남","대구","부산","울산"]],["제주",["제주"]],["전국",["전국"]]];
const CATS=["전체","문화예술","인문·출판","관광","소상공인","금융","기업·판로","체육"];
const state={q:"",reg:"전체",cat:"전체",fav:false,closed:false,hideRental:true,limit:60};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let favs=new Set(store.get("gr-favs3",[]));
let DATA=[];
const now=new Date();const TODAY=new Date(now.getFullYear(),now.getMonth(),now.getDate());

const parse=s=>{if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const DAY=86400000;
const isClosed=d=>d.e&&parse(d.e)<TODAY;
function status(d){
  if(isClosed(d))return{cls:"closed",big:"마감",small:"종료"};
  const s=parse(d.s);
  if(!d.e){if(s&&s>TODAY)return{cls:"upcoming",big:"예정",small:"접수 전"};return{cls:"",big:"상시",small:"예산 소진 시"}}
  const left=Math.round((parse(d.e)-TODAY)/DAY);
  if(s&&s>TODAY)return{cls:"upcoming",big:"D-"+left,small:Math.round((s-TODAY)/DAY)+"일 후 접수"};
  if(left===0)return{cls:"urgent",big:"D-DAY",small:"오늘 마감"};
  if(left<=3)return{cls:"urgent",big:"D-"+left,small:"마감 임박"};
  if(left<=10)return{cls:"soon",big:"D-"+left,small:"접수 중"};
  return{cls:"",big:"D-"+left,small:"접수 중"};
}
const fmt=s=>s?s.slice(2).replace(/-/g,"."):"";
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function chips(el,arr,key,label){
  el.innerHTML='<span class="lbl">'+label+'</span>';
  arr.forEach(v=>{const name=Array.isArray(v)?v[0]:v;const b=document.createElement("button");b.className="chip";b.textContent=name;b.id=key+"-"+name;
    b.setAttribute("aria-pressed",state[key]===name);b.onclick=()=>{state[key]=name;state.limit=60;chips(el,arr,key,label);render()};el.appendChild(b)});
}
function filtered(){
  const q=state.q.trim().toLowerCase();const grp=(REGIONS.find(r=>r[0]===state.reg)||[])[1];
  return DATA.filter(d=>{
    if(state.fav&&!favs.has(d.id))return false;
    if(grp&&!grp.includes(d.reg))return false;
    if(state.cat!=="전체"&&d.cat!==state.cat)return false;
    if(!state.closed&&isClosed(d))return false;
    if(state.hideRental&&d.rental&&!q.includes("대관"))return false;
    if(q&&!(d.t+" "+d.org+" "+d.reg+" "+d.cat+" "+(d.tgt||"")).toLowerCase().includes(q))return false;
    return true}).sort((a,b)=>{const ca=isClosed(a),cb=isClosed(b);if(ca!==cb)return ca?1:-1;
      const ea=a.e?parse(a.e):null,eb=b.e?parse(b.e):null;if(!ea&&!eb)return 0;if(!ea)return 1;if(!eb)return -1;return ca?eb-ea:ea-eb});
}
function render(){
  const rows=filtered();const list=document.getElementById("list");
  const soon=rows.filter(d=>{if(!d.e||isClosed(d))return false;const l=(parse(d.e)-TODAY)/DAY;return l<=7}).length;
  document.getElementById("count").innerHTML=`<b>${rows.length}</b>건 · 7일 안에 마감 <b>${soon}</b>건 · 마감 임박순`;
  if(!rows.length){list.innerHTML=`<li class="empty">${state.fav?"아직 관심 공고가 없습니다. 공고의 ☆을 눌러 담아두세요.":"조건에 맞는 공고가 없습니다. 지역이나 분야를 '전체'로 바꿔 보세요."}</li>`;document.getElementById("more").hidden=true;return}
  list.innerHTML=rows.slice(0,state.limit).map(d=>{const st=status(d);const on=favs.has(d.id);
    const per=d.s?`${fmt(d.s)} ~ ${d.e?fmt(d.e):"상시"}`:(d.e?`~ ${fmt(d.e)} 마감`:"상시 접수");
    return `<li class="item">
      <div class="dday ${st.cls}">${st.big}<small>${st.small}</small></div>
      <div class="body">
        <div class="meta"><span class="tag">${d.cat}</span><span class="tag reg">${d.reg}</span>${d.type?`<span class="tag reg">${esc(d.type.split("/")[0])}</span>`:""}</div>
        <h2 class="title"><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.t)}</a></h2>
        <div class="info"><span>${esc(d.org)}</span><span class="per">${per}</span>${d.tgt?`<span>대상 ${esc(d.tgt)}</span>`:""}<span>출처 ${esc(d.src)}</span></div>
      </div>
      <button class="star" data-id="${d.id}" aria-pressed="${on}" aria-label="관심 공고 ${on?"해제":"추가"}">${on?"★":"☆"}</button>
    </li>`}).join("");
  const mb=document.getElementById("more");mb.hidden=rows.length<=state.limit;mb.textContent=`더 보기 (${rows.length-state.limit}건 남음)`;
}
function stats(){
  const open=DATA.filter(d=>!isClosed(d));const by=k=>open.filter(d=>d.cat===k).length;
  document.getElementById("stats").innerHTML=`접수 중 <b>${open.length}</b>건 · 경기 <b>${open.filter(d=>d.reg==="경기").length}</b> · 문화예술 <b>${by("문화예술")}</b> · 소상공인 <b>${by("소상공인")}</b> · 관광 <b>${by("관광")}</b>`;
}
function build(items){
  const norm=s=>s.replace(/\[[^\]]*\]/g,"").replace(/[^가-힣a-zA-Z0-9]/g,"").slice(0,24);
  const seen=new Set();const out=[];
  items.forEach(r=>{
    const d={...r};
    if(!d.reg)d.reg=inferReg(d.org||"",d.t||"");
    if(!d.cat)d.cat=bizCat(d.t+" "+(d.org||""),d.field);
    const k=norm(d.t||"");if(!k||seen.has(k))return;seen.add(k);
    d.id=(d.url.match(/(rcrtSn=|bizCyclId=|pblancId=)([A-Z_0-9]+)/)||[])[2]||("r"+out.length);
    d.rental=/대관/.test(d.t);out.push(d)});
  return out;
}
document.getElementById("list").addEventListener("click",e=>{const b=e.target.closest(".star");if(!b)return;const id=b.dataset.id;favs.has(id)?favs.delete(id):favs.add(id);store.set("gr-favs3",[...favs]);render()});
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;state.limit=60;render()});
document.getElementById("showClosed").addEventListener("change",e=>{state.closed=e.target.checked;render()});
document.getElementById("hideRental").addEventListener("change",e=>{state.hideRental=e.target.checked;render()});
document.getElementById("more").addEventListener("click",()=>{state.limit+=60;render()});
function setTab(f){state.fav=f;document.getElementById("tab-all").setAttribute("aria-selected",!f);document.getElementById("tab-fav").setAttribute("aria-selected",f);render()}
document.getElementById("tab-all").onclick=()=>setTab(false);
document.getElementById("tab-fav").onclick=()=>setTab(true);
chips(document.getElementById("regions"),REGIONS,"reg","지역");
chips(document.getElementById("cats"),CATS,"cat","분야");
document.getElementById("list").innerHTML='<li class="empty">공고를 불러오는 중…</li>';
fetch("data.json?t="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(doc=>{
  DATA=build(doc.items||[]);
  document.getElementById("asof").textContent="수집 기준 "+(doc.updated||"").replace(/-/g,".");
  stats();render();
}).catch(()=>{document.getElementById("list").innerHTML='<li class="empty">공고 데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</li>'});
</script>
